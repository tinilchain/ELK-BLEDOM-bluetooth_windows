[package]
name = "elk-bledom-controller"
version = "0.1.0"
authors = ["TheSylex"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
btleplug = "0.10"
chrono = "0.4"
uuid = "1.0"
futures = "0.3"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpal = "0.15"  # 音频处理
tokio-stream = "0.1"